
import net.neoforged.moddevgradle.legacyforge.tasks.RemapJar
plugins {

    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'com.github.johnrengelman.shadow' version '8.1.1'

}

// Keep each Minecraft version's build output (incl. the ModDev artifacts) apart so switching branches in this folder
// never collides with, or is blocked by, the other version's files.
layout.buildDirectory = layout.projectDirectory.dir("build/mc-${project.property('minecraft_version')}")



configurations {
    shadow {
        extendsFrom implementation
    }
}


def generatedResources = file("src/generated")


sourceSets {

    main.resources {

        srcDir 'src/main/resources'
        srcDir 'src/generated/resources'

    }

    // The GregTech 8 implementation. GT 8 has a different API from 7.x (substructures, ModularUI, new sync system), so
    // its code is a separate set of classes, compiled against GT 8 and shipped in the same jar. The mod entry point
    // picks one set at startup from the installed GregTech version; the other set is never loaded.
    gtm8 {
        java.srcDir 'src/gtm8/java'
    }

}

repositories {

    mavenLocal()
    mavenCentral()
    maven { //GTM maven
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
            includeGroup 'appeng'
            includeGroup 'lu.kolja'

        }
    }
    maven {
// 'Ars'
        url 'https://maven.blamejared.com'
    }

    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdarkdev.xyz/snapshots/"
    }
    maven {
// latvian.dev Maven (KubeJS and Rhino)
        url = "https://maven.latvian.dev/releases"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
// Patchouli, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
// EMI
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    maven {
        url = "https://maven.architectury.dev"
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
// 'Curios'
        url "https://maven.blamejared.com"
    }
    maven {
        url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        name = "ftbMavenReleases"
        url = uri("https://maven.ftb.dev/releases")
    }
}


version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }
sourceSets.main.resources { srcDir 'src/generated/resources' }


legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
            sourceSet = sourceSets.main
        }
        client {
            client()
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }


        data {
            data()
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }

        gameTestServer {
            // No client()/server()/data()-style convenience method for this exists in this MDG
            // version, but the run "type" is a plain FML-defined string, same as the others.
            type = 'gameTestServer'
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui')
        }
    }


    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gtm8)
        }
    }
}

// Gives the `test` source set access to Minecraft/GTCEu/etc. so unit tests can reference
// mod types. The legacyforge plugin doesn't expose the newer `unitTest { }` DSL (that's
// NeoForge-only), so this is the manual equivalent.
legacyForge.addModdingDependenciesTo(sourceSets.test)
// GregTech 7 is compile-only on main (the runtime GregTech is chosen by the -Pgtm switch), so give the tests main's
// compile classpath too.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

test {
    useJUnitPlatform()
}

jar {
    manifest.attributes([
            "MixinConfigs": "phoenix_fission.mixins.json"
    ])
    from sourceSets.gtm8.output
}

mixin {
// MixinGradle Settings
    add sourceSets.main, 'mixins.phoenix_fission.refmap.json'
    config 'phoenix_fission.mixins.json'
}

configurations {
    gtm8CompileOnly.extendsFrom(compileOnly, implementation)
}
def gtm8Remapped = obfuscation.createRemappingConfiguration(configurations.gtm8CompileOnly)
sourceSets.gtm8.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath

apply from: "$rootDir/gradle/scripts/spotless.gradle"


dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")

    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')

// JEI, EMI, Jade
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    modImplementation("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modRuntimeOnly("curse.maven:jade-324717:5390389")
    modCompileOnly("curse.maven:jade-324717:5390389")



// GregTech and dependencies
    // Compile against GregTech 7.x; the GT 8 classes compile in the gtm8 source set.
    modCompileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modGtm8CompileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu8_version}:slim") { transitive = false }
    modGtm8CompileOnly("brachy.modularui:modularui-mc${minecraft_version}:${mui8_version}") { transitive = false }
    // The GT 8 snapshot jar-in-jars these (its slim jar leaves them out), so a dev run on it has to provide them.
    if (project.findProperty('gtm') == '8') {
        modRuntimeOnly("brachy.modularui:modularui-mc${minecraft_version}:${mui8_version}") { transitive = false }
        modRuntimeOnly("io.github.llamalad7:mixinextras-forge:0.5.3")
        modRuntimeOnly("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1")
    }
    // Which GregTech the dev client/server runs: 7.x by default, the GT 8 snapshot with -Pgtm=8, or an exact version
    // with -Pgtm=<version> (for example -Pgtm=8.0.0).
    modRuntimeOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${project.findProperty('gtm') == '8' ? gtceu8_version : (project.findProperty('gtm') ?: gtceu_version)}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    modImplementation("dev.latvian.mods:rhino-forge:${rhino_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")
    modRuntimeOnly("dev.architectury:architectury-forge:${architectury_version}")


    modRuntimeOnly("curse.maven:kubejs-aisle-tool-1236291:7543948")


// lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    gtm8AnnotationProcessor 'org.projectlombok:lombok:1.18.24'

// tests
    testCompileOnly("org.jetbrains:annotations:26.0.1")
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

configurations.configureEach {
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}




tasks.named('jar', Jar).configure {
    archiveClassifier.set('slim')
    finalizedBy 'reobfJar'
}


shadowJar {

    archiveClassifier.set('unreobf-shadow')
    configurations = [project.configurations.shadow]
    relocate 'appeng', "${project.maven_group}.relocated.ae2"
    finalizedBy 'reobfShadowJar'
}

tasks.named("build") {
    dependsOn("spotlessApply")
}
